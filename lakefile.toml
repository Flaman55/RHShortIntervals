name = "RHShortIntervals"
defaultTargets = ["PNTPort", "Applications", "Challenge", "Solution"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
pp.unicode.fun = true
maxHeartbeats = 4000000

# Mathlib at the commit pinned by grh-compact, for which PNTPort/ was ported.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# Files of PrimeNumberTheoremAnd (Apache-2.0), ported to this Mathlib; see PORTING.md.
[[lean_lib]]
name = "PNTPort"
globs = ["PNTPort.+"]

[[lean_lib]]
name = "Applications"
globs = ["Applications.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
